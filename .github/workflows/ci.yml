# CI: checks every change. Runs on pushes to feature branches.
# deploy.yml also calls this workflow before deploying, so main/develop are checked there.
#
# Pull requests are not checked separately: the branch was already checked
# when it was pushed, and checking the same code again only adds waiting.
#
# Only the checks for the kind of files that changed run (PHP, JS, CSS).
# A change to the workflows, or a manual run, checks everything.
name: CI

on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      php: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.php == 'true' }}
      js: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.js == 'true' }}
      css: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.css == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
            php:
              - *shared
              - '**/*.php'
              - '**/block.json'
              - '**/composer.json'
              - '**/composer.lock'
              - 'phpcs.xml.dist'
              - 'phpunit.xml.dist'
              - '.wp-env.json'
            js:
              - *shared
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/block.json'
              - 'package.json'
              - 'package-lock.json'
              - 'webpack.config.js'
              - '.nvmrc'
            css:
              - *shared
              - '**/*.css'
              - '**/*.scss'
              - 'package.json'
              - 'package-lock.json'

  php-lint:
    name: PHP coding standards
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install PHP tools
        run: composer install --no-interaction --no-progress

      - name: PHPCS
        run: composer lint

  js:
    name: JavaScript lint, tests and build
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS tools
        run: npm ci

      - name: JavaScript lint
        run: npm run lint:js

      - name: JavaScript unit tests (Jest)
        run: npm run test:js

      - name: Build blocks
        run: npm run build

  css-lint:
    name: CSS lint
    needs: changes
    if: needs.changes.outputs.css == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS tools
        run: npm ci

      - name: CSS lint
        run: npm run lint:css

  phpunit:
    name: PHPUnit
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          npm ci

      - name: Build blocks
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Run PHPUnit
        run: npm run test:php
